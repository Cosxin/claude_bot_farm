[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "losscandles"
version = "0.1.0"
description = "A real TensorBoard plugin that renders training loss as OHLC candlestick charts, complete with indicators."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "losscandles" }]
keywords = ["pytorch", "tensorboard", "candlestick", "ohlc", "training", "visualization", "plugin"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Framework :: TensorBoard",
]
dependencies = [
    "numpy>=1.24",
    "tensorboard>=2.14",
    "werkzeug>=2.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7.4"]

[project.entry-points."tensorboard_plugins"]
losscandles = "losscandles.plugin:LossCandlesPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
losscandles = ["static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
